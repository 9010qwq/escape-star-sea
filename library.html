<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111d">
  <title>原作资料馆 · 逃离星海</title>
  <meta name="description" content="阅读逃离星海原始牌面、当前游戏效果与宇宙科普路书。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="library.css?v=1.0.4">
</head>
<body>
  <a class="skip-link" href="#libraryContent">跳到资料内容</a>
  <header class="library-header">
    <a class="back-link" href="index.html">← 返回对局</a>
    <a class="rule-link" href="rules.html">游戏规则 ↗</a>
  </header>
  <main class="library-shell">
    <div class="library-heading"><p class="eyebrow">ESCAPE THE SEA OF STARS</p><h1>原作资料馆</h1><p class="lead">一张牌，一段星际旅程。</p></div>
    <div class="library-tabs" role="tablist" aria-label="资料类别">
      <button id="cardsTab" role="tab" type="button" aria-selected="true" aria-controls="cardsPanel">原作卡牌 <span id="cardsTotal"></span></button>
      <button id="fieldbookTab" role="tab" type="button" aria-selected="false" aria-controls="fieldbookPanel" tabindex="-1">宇宙科普路书 <span id="fieldbookTotal"></span></button>
    </div>
    <div id="libraryContent" tabindex="-1">
      <section id="cardsPanel" role="tabpanel" aria-labelledby="cardsTab">
        <p class="library-note">原图保留原作文字。下方效果来自当前游戏；个别表述有差异时，以<a href="rules.html">规则页的明确裁定</a>为准。</p>
        <form class="card-filters" role="search" id="cardSearchForm">
          <label class="search-label" for="cardSearch"><span>查找卡牌</span><input id="cardSearch" type="search" placeholder="卡名、牌面或效果，例如：掠夺" autocomplete="off"></label>
          <label class="type-label" for="cardType"><span>卡牌类型</span><select id="cardType"><option value="all">全部类型</option><option value="equipment">装备</option><option value="instant">瞬发</option><option value="normal">普通</option><option value="immediate">立即</option></select></label>
        </form>
        <p id="cardResults" class="result-count" role="status" aria-live="polite"></p>
        <div id="cardGrid" class="card-grid"></div>
        <p id="cardEmpty" class="empty-message" hidden>没有找到这张牌。试试更短的关键词，或切换到“全部类型”。</p>
      </section>
      <section id="fieldbookPanel" role="tabpanel" aria-labelledby="fieldbookTab" hidden>
        <p class="library-note">原作科普资料，带你认识星图里的宇宙。这些内容不作为游戏结算规则；点击任一页可展开、滚动和放大阅读。</p>
        <div id="fieldbookGrid" class="fieldbook-grid"></div>
      </section>
    </div>
    <noscript><p class="empty-message">此资料馆需要启用 JavaScript 来读取卡牌与图片。你也可以返回<a href="index.html">对局</a>或阅读<a href="rules.html">规则说明</a>。</p></noscript>
    <footer class="library-footer"><span>逃离星海 · 原作资料馆</span><a href="index.html">继续航行 →</a></footer>
  </main>
  <dialog id="artReader" class="art-reader" aria-labelledby="readerTitle">
    <div class="reader-header"><div><p id="readerKind" class="eyebrow"></p><h2 id="readerTitle"></h2></div><button id="closeReader" type="button" class="reader-close">返回 ×</button></div>
    <div class="reader-toolbar"><div class="reader-zoom" role="group" aria-label="调整图片大小"><button id="zoomOut" type="button" aria-label="缩小图片">−</button><span id="zoomValue" aria-live="polite">100%</span><button id="zoomIn" type="button" aria-label="放大图片">＋</button><button id="zoomFit" type="button">适合宽度</button></div><span class="reader-hint">放大后可横向、纵向滚动</span></div>
    <div class="reader-body"><div id="readerViewport" class="reader-image-viewport" tabindex="0" aria-label="原图阅读区，可滚动"><img id="readerImage" alt=""></div><aside class="reader-description"><p id="readerMeta" class="reader-meta"></p><h3 id="readerEffectTitle">当前游戏效果</h3><p id="readerEffect"></p><p class="reader-note" id="readerNote"></p><a id="readerRules" href="rules.html">查看完整游戏规则 ↗</a></aside></div>
    <div class="reader-navigation"><button id="previousArt" type="button">← 上一张</button><span id="readerPosition"></span><button id="nextArt" type="button">下一张 →</button></div>
  </dialog>
  <script src="game-data.js?v=1.0.4"></script>
  <script src="card-art.js?v=1.0.4"></script>
  <script src="library.js?v=1.0.4"></script>
</body>
</html>
